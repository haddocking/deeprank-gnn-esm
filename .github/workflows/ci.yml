name: ci

on:
  pull_request:
    branches: [main]

jobs:
  # Decide whether the code has to be tested. The jobs are skipped when the PR
  # changes no code (only *.md files), or when a push does not change the code
  # of the PR (e.g. a conflict resolution in a *.md file, or a merge of main)
  # and ci-passed succeeded on the previous head.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check whether the code changed
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          # without pipefail, a failing git diff would give an empty patch id
          set -o pipefail
          code=true
          # everything but the *.md files counts as code
          paths=(. ':(exclude,glob)**/*.md')
          # diff of the PR itself (against its merge base); patch-id ignores
          # line numbers, so that merging main does not count as a change
          patch_id() {
            git diff "$(git merge-base "$BASE" "$1")" "$1" -- "${paths[@]}" \
              | git patch-id --stable | cut -d' ' -f1
          }
          if ! git fetch -q --no-tags origin "$BASE" "$AFTER"; then
            echo "Could not fetch the PR commits: testing everything."
          elif ! after=$(patch_id "$AFTER"); then
            echo "Could not compare the PR with its base: testing everything."
          elif [ -z "$after" ]; then
            code=false
            echo "The PR changes no code."
          elif [ "$ACTION" = synchronize ] \
            && git fetch -q --no-tags origin "$BEFORE" \
            && before=$(patch_id "$BEFORE") && [ "$before" = "$after" ]; then
            # skipped jobs would hide failures: only skip when ci-passed
            # succeeded on the previous head
            passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BEFORE}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci-passed")]
                    | (length > 0) and all(.conclusion == "success")' || echo false)
            if [ "$passed" = true ]; then
              code=false
              echo "The code of the PR is unchanged and ci-passed succeeded on ${BEFORE}."
            else
              echo "The code of the PR is unchanged, but ci-passed did not succeed on ${BEFORE}."
            fi
          fi
          echo "code=${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # Only test older and newer supported versions
        python-version: ["3.9", "3.14"]
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: install package with dev dependencies
        run: uv pip install --system ".[dev]"

      - name: run unit tests
        run: >-
          pytest -m "not e2e"
          --cov
          --cov-report xml:coverage.xml
          --cov-append
          -vv
          --hypothesis-show-statistics

      - name: cache ESM model checkpoint
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: esm2_t33_650M_UR50D

      - name: run end-to-end tests
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: >-
          pytest -m e2e
          --cov
          --cov-report xml:coverage.xml
          --cov-append
          -vv

      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        if: >-
          ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' && (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  build-docker:
    name: test if docker is buildable
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]

    steps:
      - uses: actions/checkout@v4

      - run: docker build -f Dockerfile.${{ matrix.variant }} .

  ci-passed:
    # One check summarising all jobs, also when they were skipped because the
    # code did not change.
    if: always()
    needs: [changes, test, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo 'test: ${{ needs.test.result }}, build-docker: ${{ needs.build-docker.result }}'
          test '${{ needs.changes.result }}' = success
          if [ '${{ needs.changes.outputs.code }}' = false ]; then
            echo 'No code to test (see the changes job).'
            exit 0
          fi
          test '${{ needs.test.result }}' = success
          test '${{ needs.build-docker.result }}' = success
